<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#05050a" />
  <title>DARKONYX PANEL</title>
  <meta name="description" content="DARKONYX PANEL — obsidian-grade Minecraft server management." />
  <link rel="icon" href="/assets/darkonyx/favicon.svg" type="image/svg+xml" />
  <meta property="og:title" content="DARKONYX PANEL" />
  <!-- Webfonts are progressive enhancement only: the UI falls back to the
       local system stack instantly and never blocks rendering offline. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" /></noscript>
  <noscript><style>.boot-hint{display:none}</style></noscript>
  <link rel="stylesheet" href="/css/darkonyx.css" />
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="grid-veil"></div>
    <div class="noise"></div>
  </div>

  <div id="app">
    <div id="boot" class="auth-solo">
      <div class="col center gap-14">
        <div class="brand-mark" style="width:52px;height:52px;flex-basis:52px">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 2.6 20.5 7v10L12 21.4 3.5 17V7L12 2.6Z" stroke="#c4b5fd" stroke-width="1.4"/><path d="M12 7.4 16.6 10v4.6L12 17.2 7.4 14.6V10L12 7.4Z" fill="#8b5cf6" fill-opacity=".85"/></svg>
        </div>
        <div class="dim small mono" id="boot-status">initialising darkonyx core…</div>
        <!-- If a script fails to load, boot.js is the last thing to run; this
             button only stays visible when the app never mounted. -->
        <div id="boot-actions" class="col center gap-8" style="display:none">
          <p class="dim small" style="max-width:38ch;text-align:center">The panel could not finish starting. Reload, and if it keeps happening check the browser console.</p>
          <button class="btn btn-primary btn-sm" onclick="location.reload()">Reload panel</button>
        </div>
      </div>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="menu-root"></div>
  <div id="toast-root" class="toasts"></div>

  <script>
    /* If any bundle fails to load, the app can never boot. Announce it instead
       of showing a splash screen that silently ignores every click. */
    window.addEventListener('error', function (e) {
      var t = e && e.target;
      if (!t || t.tagName !== 'SCRIPT') return;
      var s = document.getElementById('boot-status');
      var a = document.getElementById('boot-actions');
      if (s) s.textContent = 'failed to load ' + (t.src || 'a script');
      if (a) a.style.display = '';
    }, true);
  </script>
  <script src="/js/icons.js"></script>
  <script src="/js/core.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/portal.js"></script>
  <script src="/js/server.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/market.js"></script>
  <script src="/js/admin-extra.js"></script>
  <script src="/js/boot.js"></script>
</body>
</html>
