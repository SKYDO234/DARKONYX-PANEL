<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="core" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#2a1b52" stop-opacity="0.95"/>
      <stop offset="42%" stop-color="#150e2c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#06060a" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#6d28d9" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#0891b2" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.10"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.08"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#a78bfa" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
  </defs>

  <!-- base obsidian field -->
  <rect width="1920" height="1080" fill="url(#core)"/>

  <!-- violet + cyan auras -->
  <ellipse cx="690" cy="330" rx="620" ry="470" fill="url(#glowA)" filter="url(#soft)"/>
  <ellipse cx="1330" cy="800" rx="580" ry="430" fill="url(#glowB)" filter="url(#soft)"/>

  <!-- technical grid -->
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- faceted obsidian shards -->
  <g fill="url(#sheen)" stroke="#a78bfa" stroke-opacity="0.16" stroke-width="1.2">
    <path d="M300 120 L520 60 L700 210 L640 430 L390 470 L250 300 Z"/>
    <path d="M1180 90 L1420 150 L1500 380 L1330 520 L1120 430 L1080 220 Z"/>
    <path d="M780 620 L1010 560 L1180 720 L1090 940 L850 900 L720 760 Z"/>
  </g>

  <!-- hairline horizon -->
  <path d="M0 760 Q480 690 960 742 T1920 700" fill="none" stroke="#8b5cf6" stroke-opacity="0.24" stroke-width="1.4"/>
  <path d="M0 800 Q520 745 960 790 T1920 760" fill="none" stroke="#22d3ee" stroke-opacity="0.13" stroke-width="1"/>

  <!-- vignette -->
  <rect width="1920" height="1080" fill="none"/>
  <radialGradient id="vig" cx="50%" cy="50%" r="72%">
    <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.82"/>
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#vig)"/>
</svg>
